
### ─────────────────────────────
### BASIC SETTINGS
### ─────────────────────────────

# Set prefix to Ctrl + Space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Start windows at 1
set -g base-index 1
setw -g pane-base-index 1

# Vi-style keybindings
setw -g mode-keys vi

# Enable mouse support
set -g mouse on

# Scrolling history size
set -g history-limit 10000

# Top status bar
set-option -g status-position top

# Kill pane with prefix + q
bind q kill-pane

# Easy pane movement (without prefix)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Splits
bind b split-window -h   # vertical split (side-by-side)
bind v split-window -v   # horizontal split (stacked)

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "✔ Config reloaded!"

### ─────────────────────────────
### CLIPBOARD INTEGRATION (X11)
### ─────────────────────────────

# Use system clipboard in copy-mode (requires xclip)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

### ─────────────────────────────
### THEMING (catppuccin theme )
### ─────────────────────────────

# Catppuccin theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
# Disable Catppuccin's default status line content
set -g @catppuccin_disable_status 'on'

#left-status: tmux icon + window name
set -g status-left-length 40
set -g status-left "#[fg=#32CD32,bold]  "

# Clean up window tab labels
# set -g window-status-format "#I #W"
# set -g window-status-current-format "#I #[bold]#W"
# Remove right-side plugin status items (clean look)
set -g status-right ''

# Optional: clean separators
set -g window-status-separator ''

### ─────────────────────────────
### SESSION MANAGEMENT
### ─────────────────────────────

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

### ─────────────────────────────
### PLUGINS
### ─────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# Initialize plugin manager (leave this last!)
run '~/.tmux/plugins/tpm/tpm'

# 🛑 Force override theme's window format
set -g window-status-separator ''

# Inactive window format
set -g window-status-format '#[bg=#f38ba8,fg=#1e1e2e] #I #[bg=default,fg=#cdd6f4,nobold,noitalics,nounderscore] #W '

# Active window format
set -g window-status-current-format '#[bg=#a6e3a1,fg=#1e1e2e,bold] #I #[bg=default,fg=#89b4fa,bold] #W '

# Transparent status bar background
set-option -g status-style bg=default,fg=#cdd6f4

# Optional: transparent window titles too
set-window-option -g window-status-style bg=default,fg=#cdd6f4
set-window-option -g window-status-current-style bg=default,fg=#89b4fa
